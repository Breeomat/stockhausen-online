  beginn: "13:30"
  ende: "17:00"
  ort: Altfellhalle
  verein: Gesangverein „Germania“ Stockhausen
  mit: [Stadt Herbstein]
  text: >-
    Am 1. Advent laden die Stadt Herbstein und der Gesangverein zu einem stimmungsvollen Nachmittag ein:
    musikalische Darbietungen, Kaffee und selbstgebackener Kuchen, gesellige Stunden mit Bekannten und Freunden.
    Seniorinnen und Senioren aus Stockhausen müssen sich nicht anmelden. Alle anderen melden sich bis Freitag, 21. November,
