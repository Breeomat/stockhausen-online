name: Veröffentlichen

on:
  push:
    branches: [main]
  schedule:
    # täglich kurz nach Mitternacht (deutsche Zeit) neu bauen: vergangene Termine und Plakate verschwinden,
    # die Tagesnotiz „Was steht heute an?“ (KI) wird neu geschrieben. GitHub startet geplante Läufe oft später;
    # das Datum nehmen Skript und Seite in deutscher Zeit.
    - cron: '5 23 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Tagesnotiz des Tages (scripts/tagesnotiz.mjs); ohne Secret oder bei Fehlern wird sie einfach übersprungen
      - name: Tagesnotiz schreiben
        run: node scripts/tagesnotiz.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
